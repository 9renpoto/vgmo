name: Bump version (cron)

on:
  schedule:
    - cron: "15 3 * * TUE"

jobs:
  scheduled_bump: # zizmor: ignore[self-repository] -- actionlint does not support the alternative syntax yet.
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/bump.yml
    with:
      semver: minor
